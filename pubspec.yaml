name: omni_remote
description: Application to send and receive data from Arduino and ESP boards using a broker and custom MQTT topics.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  bloc: ^9.2.1
  country_flags: ^4.1.2
  equatable: ^3.0.0
  expressive_kit: ^0.0.9
  firebase_analytics: ^13.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_performance: ^0.12.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hugeicons: ^4.4.0
  intl: ^0.20.3
  material_ui: ^1.9.0
  mqtt_client: ^10.14.0
  package_info_plus: ^10.2.2
  typed_data: ^1.4.0
  uuid: ^4.6.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter_launcher_icons:
  android: true
  image_path_android: "assets/images/app-main-logo-rounded.png"
  adaptive_icon_background: "#145EB9"
  adaptive_icon_foreground: "assets/images/app-main-logo-rounded.png"
  ios: true
  image_path_ios: "assets/images/app-main-logo-rounded.png"
  remove_alpha_ios: true
  background_color_ios: "#145EB9"
  web:
    generate: true
    image_path: "assets/images/logo-web.png"
    background_color: "transparent"
  windows:
   generate: true
   image_path: "assets/images/logo-windows.png"
   icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/logo-macos.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
