name: omni_remote
description: Application to send and receive data from Arduino and ESP boards using a broker and custom MQTT topics.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  bloc: ^9.2.1
  country_flags: ^4.1.2
  equatable: ^2.0.8
  firebase_analytics: ^12.4.3
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  firebase_performance: ^0.11.4+2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.2.1
  go_router: ^17.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hugeicons: ^1.1.7
  intl: ^0.20.2
  mqtt_client: ^10.11.11
  package_info_plus: ^10.1.0
  typed_data: ^1.4.0
  uuid: ^4.5.3

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mockito: ^5.6.4
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter_launcher_icons:
  android: true
  image_path_android: "assets/images/app-main-logo-rounded.png"
  adaptive_icon_background: "#145EB9"
  adaptive_icon_foreground: "assets/images/app-main-logo-rounded.png"
  ios: true
  image_path_ios: "assets/images/app-main-logo-rounded.png"
  remove_alpha_ios: true
  background_color_ios: "#145EB9"
  web:
    generate: true
    image_path: "assets/images/logo-web.png"
    background_color: "transparent"
  windows:
   generate: true
   image_path: "assets/images/logo-windows.png"
   icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/logo-macos.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-VariableFont.ttf
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-VariableFont.ttf
        - asset: assets/fonts/Merriweather-Italic-VariableFont.ttf
          style: italic
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont.ttf
        - asset: assets/fonts/Montserrat-Italic-VariableFont.ttf
          style: italic
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-VariableFont.ttf
        - asset: assets/fonts/Nunito-Italic-VariableFont.ttf
          style: italic
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-VariableFont.ttf
        - asset: assets/fonts/OpenSans-Italic-VariableFont.ttf
          style: italic
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-VariableFont.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-VariableFont.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic-VariableFont.ttf
          style: italic
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-VariableFont.ttf
        - asset: assets/fonts/Roboto-Italic-VariableFont.ttf
          style: italic
    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-VariableFont.ttf
        - asset: assets/fonts/SourceCodePro-Italic-VariableFont.ttf
          style: italic
